version: '3.8'

services:
  app:
    image: ghcr.io/isurushan/innova-pos-app:latest
    container_name: innovapos-app
    restart: always
    environment:
      - NODE_ENV=production
      # Externalized DB/Cache connections (set via host env or docker .env from Key Vault)
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=${REDIS_URL}
      # - MONGO_URI=mongodb://mongodb:27017/innovapos
      # - REDIS_URL=redis://redis:6379
      - CLOUD_PROVIDER=azure
      - AZURE_KEY_VAULT_URL=https://cafinity-prod-key.vault.azure.net/
      - AZURE_KEY_VAULT_SECRET_NAME=innovapos-production-env
    volumes:
      - uploads-data:/app/apps/pos/server/uploads
      - logs-data:/app/logs
    # depends_on removed — MongoDB and Redis are externalized

  nginx:
    image: ghcr.io/isurushan/innova-pos-nginx:latest
    container_name: innovapos-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - uploads-data:/usr/share/nginx/html/uploads:ro
      # Mount SSL certificates from VM host (Certbot standalone/renewed on host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

volumes:
  uploads-data:
  logs-data:
