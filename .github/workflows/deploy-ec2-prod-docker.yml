name: Deploy production (Docker Compose)

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-ec2-prod-docker
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-app:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: nginx
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-nginx:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-nginx:${{ github.sha }}
          build-args: |
            NGINX_CONFIG_DIR=docker/nginx/prod
            VITE_POS_URL=${{ secrets.PROD_VITE_POS_URL }}
            VITE_ADMIN_URL=${{ secrets.PROD_VITE_ADMIN_URL }}
            VITE_PUBLIC_WEB_URL=${{ secrets.PROD_VITE_PUBLIC_WEB_URL }}
            VITE_QR_ORDER_WEB_ORIGIN=${{ secrets.PROD_VITE_QR_ORDER_WEB_ORIGIN }}
            VITE_API_URL=${{ secrets.PROD_VITE_API_URL }}
            VITE_PUBLIC_WEB_API_URL=${{ secrets.PROD_VITE_PUBLIC_WEB_API_URL }}
            VITE_QR_ORDER_API_URL=${{ secrets.PROD_VITE_QR_ORDER_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VM via SSH
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "${{ secrets.PROD_EC2_APP_PATH }}"

      - name: Run Deploy Command on VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_PATH="${{ secrets.PROD_EC2_APP_PATH }}"
            cd "$APP_PATH"
            
            SUDO=''
            if [ "$(id -u)" -ne 0 ]; then
              SUDO='sudo'
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo 'Docker not found on VM. Installing Docker Engine and Compose plugin...'
              $SUDO apt-get update
              $SUDO apt-get install -y ca-certificates curl gnupg lsb-release
              $SUDO mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              $SUDO apt-get update
              $SUDO apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
            fi
            
            # Log into GHCR on VM
            echo "${{ secrets.GITHUB_TOKEN }}" | $SUDO docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Rename compose file to default name
            mv -f docker-compose.prod.yml docker-compose.yml

            # Pull latest images and restart containers
            $SUDO docker compose pull
            $SUDO docker compose up -d --remove-orphans
            
            # Prune old images
            $SUDO docker image prune -f
