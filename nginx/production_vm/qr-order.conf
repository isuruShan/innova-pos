# ──────────────────────────────────────────────────────────────────────────────
# QR Order – Production VM Nginx Site Configuration
# Serves the guest-facing QR table order SPA + proxies /api/* and WebSockets to :5010
# ──────────────────────────────────────────────────────────────────────────────

upstream qr_backend {
    server 127.0.0.1:5010;
    keepalive 16;
}

# HTTP Redirect Block (Port 80 -> Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name shop.cafinity.io;

    # Certbot standalone verification / ACME challenges
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.cafinity.io;

    access_log /var/log/nginx/qr-order-access.log;
    error_log  /var/log/nginx/qr-order-error.log warn;

    client_max_body_size 10M;

    # ── SSL Certificates ──────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/shop.cafinity.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.cafinity.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-XSS-Protection         "1; mode=block"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      expired no-cache no-store private auth;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml;

    # ── API routes ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://qr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ── WebSocket support (Socket.IO for real-time order updates) ────────────
    location /socket.io/ {
        proxy_pass http://qr_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
    }

    # ── React SPA root ────────────────────────────────────────────────────────
    root  /home/azureuser/InnovaSolution/innova-pos/apps/qr-order/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── Static assets (long-term cache) ──────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Favicon ───────────────────────────────────────────────────────────────
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
