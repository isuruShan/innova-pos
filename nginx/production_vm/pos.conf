# ──────────────────────────────────────────────────────────────────────────────
# POS App – Production VM Nginx Site Configuration
# Serves the React SPA + proxies /api/* to the Node/PM2 cluster on :5000
# ──────────────────────────────────────────────────────────────────────────────

upstream pos_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# HTTP Redirect Block (Port 80 -> Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name pos.cafinity.io;

    # Certbot standalone verification / ACME challenges
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pos.cafinity.io;

    access_log /var/log/nginx/pos-access.log;
    error_log  /var/log/nginx/pos-error.log warn;

    client_max_body_size 10M;

    # ── SSL Certificates ──────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/pos.cafinity.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.cafinity.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-XSS-Protection         "1; mode=block"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      expired no-cache no-store private auth;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml;

    # ── React SPA root ────────────────────────────────────────────────────────
    root  /home/azureuser/InnovaSolution/innova-pos/apps/pos/client/dist;
    index index.html;

    # Vite hashed bundles — cache forever
    location ~* \.(js|css)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Other static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires    30d;
        add_header Cache-Control "public";
        try_files  $uri =404;
    }

    # User-uploaded files served directly by nginx (bypasses Node.js)
    location /uploads/ {
        alias /home/azureuser/InnovaSolution/innova-pos/apps/pos/server/uploads/;
        expires    7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    # ── API – proxy to PM2 cluster ────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://pos_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    30s;
        proxy_connect_timeout  5s;
        proxy_send_timeout    30s;

        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA catch-all
    location / {
        try_files $uri $uri/ /index.html;
    }
}
