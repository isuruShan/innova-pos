<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Cafinity admin portal — installable web app for merchants." />
    <meta name="theme-color" content="#ff6b35" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo-2.png" />
    <link rel="apple-touch-icon" href="/logo-2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cafinity — Admin Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker for PWA functionality
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('✅ ServiceWorker registered:', registration.scope);
              
              // Check for updates
              registration.addEventListener('updatefound', () => {
                console.log('🔄 ServiceWorker update found');
              });
            })
            .catch(error => {
              console.error('❌ ServiceWorker registration failed:', error);
            });
        });
      } else {
        console.warn('⚠️ ServiceWorkers not supported in this browser');
      }

      // Listen for install prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('✅ PWA install prompt available');
        e.preventDefault();
        deferredPrompt = e;
        // You can show a custom install button here
        // For now, users can install via browser menu
      });

      window.addEventListener('appinstalled', () => {
        console.log('✅ PWA installed successfully');
        deferredPrompt = null;
      });
    </script>
  </body>
</html>
