<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        document.documentElement.dataset.theme = 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="description" content="Cafinity point of sale — runs offline-capable as an installed app." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo-1.png" />
    <link rel="apple-touch-icon" href="/logo-1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cafinity POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Evict any stale service worker that might be serving a cached old bundle.
      // This runs before vite-plugin-pwa registers the new SW, so stale caches
      // are cleared on first load after a deployment.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((reg) => {
            // Force the waiting SW (new version) to activate immediately.
            if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          });
        });

        // When the new SW takes over, reload to get the fresh bundle.
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          // Only reload once to avoid an infinite loop.
          if (!sessionStorage.getItem('sw-reloaded')) {
            sessionStorage.setItem('sw-reloaded', '1');
            window.location.reload();
          }
        });
      }

      // Listen for install prompt
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-beforeinstallprompt', { detail: e }));
      });

      window.addEventListener('appinstalled', () => {
        window.deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
  </body>
</html>
